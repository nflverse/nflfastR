# Checks the patches of inst/pbp_patches.dcf against the current raw data and
# parser. The raw data can change without a change of nflfastR, so this runs
# every week. A failure lists the patches that need a look; see the section on
# patches in .github/CONTRIBUTING.md.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

name: check-patches.yaml

permissions: read-all

jobs:
  check-patches:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgload
            nflverse/fastrmodels
            nflverse/nflreadr

      - name: Check patches
        run: pkgload::load_all(); check_pbp_patches()
        shell: Rscript {0}
