# This file lists all column names available after `get_pbp_nfl()` which means
# these are the column names that could potentionally be patched with `patch_pbp()`
# We store them in this yaml file because it allows comments. We remove several
# columns by commenting them out
# The final result will be saved in nflfastR so we can reference it for valid
# column names in `"inst/patch_pbp.json"` for manual patches
